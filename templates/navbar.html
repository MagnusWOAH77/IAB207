<nav class="navbar navbar-light bg-light">
  <a class="navbar-brand" href="/">Concerts</a>

  <div class="d-flex align-items-center">
        <form class="form-inline mr-2" id="search-form">
            <input class="form-control form-control-sm" type="search" name="search" placeholder="Search" aria-label="Search">
        </form>
        <div class="btn-group">
            <button type="button" class="btn" data-toggle="dropdown" aria-expanded="false">
                <span class="navbar-toggler-icon"></span>
            </button>
            <ul class="dropdown-menu dropdown-menu-right">
                <li><a class="dropdown-item" href="/">Home</a></li>
                <li><a class="dropdown-item" href="/event-create">Create Event</a></li>
                <li><a class="dropdown-item" href="/my-events">My Events</a></li>
                <li><a class="dropdown-item" href="/history">History</a></li>
                <li><hr class="dropdown-divider"></li>
                <li><a class="dropdown-item" href="{{ url_for('logout') }}">Sign Out</a></li>
            </ul>
        </div>
    </div>
    <script>

        const searchForm = document.querySelector("#search-form");

        searchForm.addEventListener('submit', async (event) => {
            event.preventDefault();

            const formData = new FormData(searchForm);
            const search = formData.get("search");
            if (search !== "") {
                const url = new URL(window.location.href);
                url.searchParams.set("search", formData.get("search"));
                window.location.href = url.href;
            }
        });

    </script>
</nav>
