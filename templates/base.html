<!DOCTYPE html>
<html lang="en">
<head>
    <title>{{ title if title else "Event Platform" }}</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>

    <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    {% block head %}{% endblock %}

    <style>
        body {
            min-height: 100vh;
            font-family: "Inter", Arial, Helvetica, sans-serif;
            background: #f8fafc;
        }

        .auth-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            background:
                radial-gradient(circle at 20% 20%, rgba(255, 255, 255, 0.12), transparent 28%),
                radial-gradient(circle at 80% 80%, rgba(59, 130, 246, 0.24), transparent 32%),
                linear-gradient(135deg, #07111f 0%, #0f2f63 45%, #123f7a 100%);
            position: relative;
            overflow: hidden;
        }

        .auth-page::before {
            content: "";
            position: absolute;
            inset: 0;
            background:
                repeating-radial-gradient(
                    circle at bottom left,
                    transparent 0 95px,
                    rgba(255,255,255,0.045) 96px 98px
                );
            opacity: 0.5;
            pointer-events: none;
        }

        .auth-box {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 460px;
            background: #f1f5f9;
            border-radius: 28px;
            padding: 3rem 2.7rem;
            box-shadow: 0 28px 70px rgba(0, 0, 0, 0.28);
        }

        .auth-title {
            text-align: center;
            font-size: 2.25rem;
            font-weight: 800;
            color: #0f2f63;
            margin-bottom: 2.4rem;
            letter-spacing: -0.04em;
        }

        .auth-form .form-label {
            display: none;
        }

        .auth-form .form-control {
            width: 100%;
            height: 56px;
            border-radius: 14px;
            border: 1.8px solid #cbd5e1;
            background: #ffffff;
            padding: 0 1rem;
            font-size: 1rem;
            color: #0f172a;
            box-shadow: none;
        }

        .auth-form .form-control::placeholder {
            color: #94a3b8;
        }

        .auth-form .form-control:focus {
            border-color: #0f2f63;
            box-shadow: 0 0 0 0.18rem rgba(15, 47, 99, 0.14);
        }

        .auth-field {
            margin-bottom: 1.1rem;
        }

        .forgot-row {
            display: flex;
            justify-content: flex-end;
            margin-top: -0.2rem;
            margin-bottom: 1.5rem;
        }

        .forgot-link {
            font-size: 0.92rem;
            color: #0f2f63;
            font-weight: 700;
            text-decoration: none;
        }

        .forgot-link:hover {
            color: #0b234a;
            text-decoration: underline;
        }

        .auth-btn {
            width: 100%;
            height: 56px;
            border: none;
            border-radius: 999px;
            background: #0f2f63;
            color: #ffffff;
            font-size: 1rem;
            font-weight: 700;
            transition: 0.2s ease;
        }

        .auth-description {
            text-align: center;
            color: #475569;
            font-size: 0.98rem;
            line-height: 1.6;
            margin-top: -1.5rem;
            margin-bottom: 2.2rem;
        }

        .auth-btn:hover {
            background: #0b234a;
            transform: translateY(-1px);
        }

        .auth-bottom-link {
            text-align: center;
            margin-top: 1.7rem;
            font-size: 0.98rem;
            color: #475569;
        }

        .auth-bottom-link a {
            color: #0f2f63;
            font-weight: 700;
            text-decoration: none;
        }

        .auth-bottom-link a:hover {
            text-decoration: underline;
        }

        @media (max-width: 576px) {
            .auth-page {
                padding: 1rem;
            }

            .auth-box {
                padding: 2.3rem 1.7rem;
                border-radius: 22px;
            }

            .auth-title {
                font-size: 1.9rem;
            }
        }
    </style>
</head>
<body>

{% if request.endpoint not in ['login_page', 'signup_page'] %}
    {% include "navbar.html" %}
{% endif %}

{% block content %}{% endblock %}

</body>
</html>
