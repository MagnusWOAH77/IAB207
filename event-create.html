<!DOCTYPE html>
<html lang="en">
<head>
    <title>Create Event</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>

    <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
    <link href="path/to/select2.min.css" rel="stylesheet" />
    <script src="path/to/select2.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<style>

form > * {
    margin: 5px;
}

</style>

</head>
<body>
    
<nav class="navbar navbar-light bg-light">
  <a class="navbar-brand" href="./index.html">Concerts</a>

  <div class="d-flex align-items-center">

    <form class="form-inline mr-2">
      <input class="form-control form-control-sm" type="search" placeholder="Search" aria-label="Search">
    </form>
    <div class="btn-group">
        <button type="button" class="btn" data-bs-toggle="dropdown" aria-expanded="false">
            <span class="navbar-toggler-icon"></span>
        </button>
        <ul class="dropdown-menu dropdown-menu-end">
            <li><a class="dropdown-item" href="./index.html">Home</a></li>
            <li><a class="dropdown-item" href="./event-create.html">Create Event</a></li>
            <li><a class="dropdown-item" href="./my-events.html">My Events</a></li>
            <li><a class="dropdown-item" href="./history.html">History</a></li>
            <li><hr class="dropdown-divider"></li>
            <li><a class="dropdown-item" href="#">Sign Out</a></li>
        </ul>
    </div>
</nav>
<div class="p-5">
    <h2>Create Event</h2>
    <form>
        <div class="mb-3">
            <label for="formFile" class="form-label">Upload Preview</label>
            <input class="form-control" type="file" id="formFile" accept="image/*">
        </div>

        <label for="event-name" class="form-lable">Event Name:</label>
        <input id="event-name" type="text" class="form-control" placeholder="Event Name">

        <label for="date-picker" class="form-lable">Date:</label>
        <input type="text" id="date-picker" class="form-control" placeholder="Select Date..">

        <label for="genre-input" class="form-lable">Genre:</label>
        <select id="genre-input" class="form-control" name="states[]" multiple="multiple">
            <option>Rock</option>
            <option>Metal</option>
            <option>Alt</option>
        </select>

        <label for="location" class="form-lable">Location:</label>
        <div class="input-group">
            <span class="input-group-text"><i class="bi bi-geo-alt"></i></span>
            <input type="text" class="form-control" id="location">
        </div>
        

        <label for="date-picker" class="form-lable">Price:</label>
        <div class="input-group">
            <span class="input-group-text">$</span>
            <input type="number" class="form-control" id="price-input" value="0">
        </div>
        
        <label for="comment">Overview:</label>
        <textarea class="form-control" rows="5" id="comment" name="Overview"></textarea>

        <button type="submit" class="btn btn-success">Create</button>
    </form>
</div>

<script>

flatpickr("#date-picker", {
    minDate: new Date().fp_incr(1),
    enableTime: true,
    dateFormat: "Y-m-d H:i"
});
$(document).ready(function() {
    $('#genre-input').select2();
});

</script>

</body>
</html>
