    <style>

        }

        .custom-brand {
            display: inline-flex;
            align-items: center;
            gap: 0.65rem;
            color: #0f2f63;
            font-weight: 800;
            font-size: 1.15rem;
            letter-spacing: -0.03em;
            text-decoration: none;
        }

        .custom-brand:hover {
            color: #0b234a;
            text-decoration: none;
        }

        .brand-mark {
            width: 38px;
            height: 38px;
            border-radius: 13px;
            display: inline-flex;
            align-items: center;
            justify-content: center;

            box-shadow: 0 8px 18px rgba(15, 47, 99, 0.22);

            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        }

        .search-box {
            position: relative;

        .search-icon {
            position: absolute;

        .search-input {
            width: 100%;

            border: 1.5px solid #dbe3ef;
            background: #f8fafc;
            color: #0f172a;
            font-size: 0.92rem;
            font-weight: 600;
            padding-left: 2.55rem;
            padding-right: 1rem;
            box-shadow: none;
        }

        .search-input::placeholder {
            color: #94a3b8;
        }

        .search-input:focus {
            background: #ffffff;
            border-color: #0f2f63;
            box-shadow: 0 0 0 0.18rem rgba(15, 47, 99, 0.14);
        }

        .menu-button {
            width: 42px;

            justify-content: center;

            line-height: 1;
            transition: 0.2s ease;
            box-shadow: 0 8px 18px rgba(15, 47, 99, 0.22);

        .menu-button:hover,
        .menu-button:focus {
            background: #0b234a;
            color: #ffffff;
            transform: translateY(-1px);
        }

        .custom-dropdown {
            min-width: 220px;
            border: none;
            border-radius: 18px;
            padding: 0.55rem;
            margin-top: 0.7rem;
            box-shadow: 0 18px 42px rgba(15, 23, 42, 0.16);
            overflow: hidden;
        }

        .custom-dropdown-item {
            display: flex;
            align-items: center;
            gap: 0.7rem;
            border-radius: 13px;
            padding: 0.72rem 0.8rem;

            font-weight: 700;
            color: #334155;
        }

        .custom-dropdown-item i {
            color: #0f2f63;
            font-size: 1rem;
            width: 18px;
            text-align: center;
        }

        .custom-dropdown-item:hover,
        .custom-dropdown-item:focus {
            background: #eff6ff;
            color: #0f2f63;
        }

        .signout-item {
            color: #dc2626;
        }

        .signout-item i {
            color: #dc2626;
        }

        .signout-item:hover,
        .signout-item:focus {

            color: #b91c1c;
        }

        @media (max-width: 768px) {
            .custom-navbar {
                padding: 0.75rem 1rem;
            }

            .custom-brand span:last-child {
                display: none;
            }

            .search-box {
                width: min(58vw, 240px);
            }
        }

        @media (max-width: 420px) {
            .navbar-inner {
                gap: 0.65rem;
            }

            .navbar-actions {
                gap: 0.5rem;
            }

            .search-box {
                width: 180px;
            }

            .brand-mark,
            .menu-button {
                width: 40px;
                height: 40px;
            }
        }
    </style>

    <script>
        const searchForm = document.querySelector("#search-form");

        searchForm.addEventListener("submit", async (event) => {
            event.preventDefault();

            const formData = new FormData(searchForm);
            const search = formData.get("search");

            if (search !== "") {
                const url = new URL(window.location.href);
                url.searchParams.set("search", formData.get("search"));
                window.location.href = url.href;
            }
        });
    </script>
