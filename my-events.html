<!DOCTYPE html>
<html lang="en">
<head>
    <title>My Events</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>

    <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
    <link href="path/to/select2.min.css" rel="stylesheet" />
    <script src="path/to/select2.min.js"></script>
</head>
<style>

p.event-icon-p {
    line-height: 0.1;
}

.event-link {
  text-decoration: none;
}

.select2-container {
    display: block;
    width: 100% !important;
}

.select2-selection {
    height: 38px !important; 
    padding: 5px;
    border: 1px solid #dee2e6 !important;
}


</style>
<body>
    
<nav class="navbar navbar-light bg-light">
  <a class="navbar-brand" href="./index.html">Concerts</a>

  <div class="d-flex align-items-center">

    <form class="form-inline mr-2">
      <input class="form-control form-control-sm" type="search" placeholder="Search" aria-label="Search">
    </form>
    <div class="btn-group">
        <button type="button" class="btn" data-bs-toggle="dropdown" aria-expanded="false">
            <span class="navbar-toggler-icon"></span>
        </button>
        <ul class="dropdown-menu dropdown-menu-end">
            <li><a class="dropdown-item" href="./index.html">Home</a></li>
            <li><a class="dropdown-item" href="./event-create.html">Create Event</a></li>
            <li><a class="dropdown-item" href="./my-events.html">My Events</a></li>
            <li><a class="dropdown-item" href="./history.html">History</a></li>
            <li><hr class="dropdown-divider"></li>
            <li><a class="dropdown-item" href="#">Sign Out</a></li>
        </ul>
    </div>
</nav>

<div class="p-3">
    <h2>Events</h2>

    <div id="events-div">
        <div id="event-card-1">
            <div class="modal fade" id="event-edit-modal-1">
            <div class="modal-dialog">
                <div class="modal-content">

                <div class="modal-header">
                    <h4 class="modal-title">Edit Event</h4>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>

                <form>
                <div class="modal-body">
                    <input type="hidden" name="event_id" value="1">

                    <div class="mb-3">
                        <label for="formFile" class="form-label">Upload Preview</label>
                        <input class="form-control" type="file" id="formFile" accept="image/*">
                    </div>

                    <label for="event-name" class="form-lable">Event Name:</label>
                    <input id="event-name" type="text" class="form-control" value="Event Title">

                    <label for="date-picker-1" class="form-lable">Date:</label>
                    <input type="text" id="date-picker-1" class="form-control">

                    <label for="date-picker" class="form-lable">Date:</label>
                    <div class="input-group">
                        <span class="input-group-text">$</span>
                        <input type="number" class="form-control" id="price-input" value="50">
                    </div>

                    <label for="genre-input-1" class="form-lable">Genre:</label>
                    <select id="genre-input-1" class="form-control" name="genres[]" multiple="multiple">
                        <option>Rock</option>
                        <option>Metal</option>
                        <option>Alt</option>
                    </select>
                    
                    <label for="comment">Overview:</label>
                    <textarea class="form-control" rows="5" id="comment" name="Overview">This is the overview that was set when the event was created. You can edit it by changing this value.</textarea>
                </div>
                
                <div class="modal-footer">
                    <button type="submit" class="btn btn-success">Edit</button>
                    <button type="button" class="btn btn-danger" data-bs-dismiss="modal">Close</button>
                </div>
                </form>

                </div>
            </div>
            </div>
            <div class="card">
            <div class="card-body">
                <div class="row">
                    <div class="col-sm-3">
                        <img src="./static/img/event.jpg" alt="Image Preview" class="img-fluid">
                    </div>
                    <div class="col-sm-9">
                        <div class="d-flex">
                            <div>
                                <h4 class="card-title">Event Title</h4>
                                <p class="card-text fw-bold event-icon-p">21 May 2026 at 6:00pm</p>
                                <p class="card-text event-icon-p">Metal, Rock</p>
                                <p class="card-text event-icon-p">$50</p>
                                <a href="#event-edit-modal-1" class="card-link event-link fw-bold" data-bs-toggle="modal">Edit</a>
                                <a href="#" class="card-link event-link fw-bold" style="color: red">Delete</a>
                            </div>
                           <div>
                                <p class="m-3">OPEN</p>
                                <p class="card-text fw-bold">Bisbane Entertainment Centre</p>
                           </div>
                        </div>
                    </div>
                </div>
            </div>
            </div>
        </div>
    </div>

</div>

<script>

// NEEDS TO BE MODIFIED TO HANDLE MULTIPLE CARDS (WILL BE DONE SERVER SIDE)
flatpickr("#date-picker-1", {
    minDate: new Date().fp_incr(1),
    defaultDate: "2026-05-21"
});
$(document).ready(function() {
    $('#genre-input-1').select2({
        dropdownParent: $("#event-edit-modal-1")
    });

    $('#genre-input-1').val(['Rock', 'Metal']).trigger('change');
});


</script>
</body>
</html>
